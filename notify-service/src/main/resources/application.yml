# Production defaults (offline notifications spec §5). Profiles local and dev override selected values.
spring:
  application:
    name: notify-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://postgres:5432/pangate
    username: pangate
    password: ${NOTIFY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 2000   # ms
      connection-init-sql: SET search_path TO notify, public
  flyway:
    # its own location: other services' migrations may share the test class path
    locations: classpath:db/notify
    schemas: notify
    default-schema: notify
  jdbc:
    template:
      query-timeout: 5s

pangate:
  service: notify

notify:
  admin-port: 8081

# Public API on :8080 (/v1/devices/self/push); actuator, /ready and /live on :8081 (notify.admin-port).
server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,connectAuth
          additional-path: "server:/ready"
          show-details: always
        liveness:
          include: livenessState
          additional-path: "server:/live"
