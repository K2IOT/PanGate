# Run from the IDE or `make auth-local` (from the repo root) against `make infra-up`.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pangate
    username: pangate
    password: pangate
auth:
  issuer: http://localhost:8090
  kafka: { bootstrap-servers: "localhost:9092" }
  seed: { enabled: true, dir: .dev/auth }
  # :8081 is the gateway's management port when both run on one machine
  admin-port: 8082
