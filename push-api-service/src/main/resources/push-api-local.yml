# Run from the IDE or `make push-api-local` against `make infra-up` and auth (`make auth-local`).
push-api:
  management-port: 8084
  kafka: { bootstrap: "localhost:9092" }
  redis: { uri: "redis://localhost:6379", topology: standalone }
  auth:
    jwks-uri: "http://localhost:8090/.well-known/jwks.json"
    issuer: "http://localhost:8090"
  grpc: { plaintext: true }
server:
  port: 8085
