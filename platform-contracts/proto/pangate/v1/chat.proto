// App chat, sub-project CH1 (chat spec §3): client ↔ chat-service payloads carried in UPSTREAM / PUSH frames, and the
// records on chat.commands / chat.events. Additive only.
syntax = "proto3";

package pangate.v1;

option java_package = "com.pangate.contracts.v1";
option java_multiple_files = true;

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
  CONVERSATION_KIND_CHANNEL = 3;
}

// Client → server, payload of UPSTREAM(type=cmd, headers.op=chat.send).
message ChatSend {
  string conversation_id = 1;
  string client_msg_id = 2;           // ULID made by the client; the dedup key
  string text = 3;                    // UTF-8, 1..4096 bytes
  string reply_to_msg_id = 4;         // optional
  repeated string mention_user_ids = 5;
}

message ChannelOpen { string conversation_id = 1; }    // op=chat.channel.open
message ChannelClose { string conversation_id = 1; }   // op=chat.channel.close

// Server → client, payload of PUSH (headers.type=chat.message).
message ChatMessage {
  string conversation_id = 1;
  string msg_id = 2;                  // ULID from the sequencer
  uint64 conv_seq = 3;
  string sender_id = 4;
  string client_msg_id = 5;           // lets the sending device replace its pending copy
  string text = 6;
  string reply_to_msg_id = 7;
  repeated string mention_user_ids = 8;
  int64 sent_at_ms = 9;
}

// Server → the sender's devices (headers.type=chat.rejected).
message ChatRejected {
  string conversation_id = 1;
  string client_msg_id = 2;
  string reason = 3;                  // not_member | not_found | too_long | rate_limited | invalid
}

// chat.commands, key conversation_id.
message ChatCommand {
  string command_id = 1;              // ULID
  string sender_id = 2;               // userId, without the chat: prefix
  string sender_device_id = 3;
  int64 received_at_ms = 4;
  oneof op { ChatSend send = 10; }
  string reply_to = 20;               // "http:<pod>" when an HTTP pod waits for the result; empty for WebSocket
}

// chat.events, key conversation_id.
message ChatEvent {
  ChatMessage message = 1;
  ConversationKind kind = 2;
}

// --- Conversation state (CH3 spec 2026-11-17-conversation-state-design.md §2) ---

// client → server, payload of UPSTREAM(type=cmd, headers.op=chat.delivered | chat.read)
message ChatMark {
  string conversation_id = 1;
  uint64 up_to_seq = 2;               // delivered / read every message with conv_seq <= up_to_seq
}
message ChatTyping { string conversation_id = 1; }      // op=chat.typing; repeated every 3 s while typing
message PresenceWatch {               // op=chat.presence.watch; replaces this device's whole list
  message Entry {
    string user_id = 1;
    string conversation_id = 2;       // a conversation both share: the proof the viewer may see this user
  }
  repeated Entry entries = 1;         // at most 200; empty = stop watching
}

// server → client (PUSH, EPHEMERAL)
message ReceiptUpdate {               // headers.type=chat.receipts
  string conversation_id = 1;
  message Mark {
    string user_id = 1;
    uint64 delivered_seq = 2;
    uint64 read_seq = 3;
  }
  repeated Mark marks = 2;            // DM and groups <= 50: marks that changed
  uint64 own_read_seq = 3;            // to the reader's other devices: unread sync
}
message TypingUpdate {                // headers.type=chat.typing
  string conversation_id = 1;
  string user_id = 2;
  uint32 ttl_ms = 3;                  // the client clears "typing" after ttl_ms without a new update (6000)
}
message PresenceUpdate {              // headers.type=chat.presence
  message State {
    string user_id = 1;
    bool online = 2;
    int64 last_seen_ms = 3;           // rounded down to the minute; 0 when online, hidden or older than 7 days
    bool recently = 4;                // true = "active recently" (older than 7 days)
    bool hidden = 5;                  // either side turned presence off (reciprocal)
  }
  repeated State states = 1;
}

// chat.receipts, key conversation_id
message ReceiptCommand {
  string user_id = 1;
  string device_id = 2;
  string conversation_id = 3;
  uint64 delivered_seq = 4;           // 0 = unchanged
  uint64 read_seq = 5;                // 0 = unchanged
  int64 received_at_ms = 6;
}

// chat.channel.notify, key conversation_id (offline notifications spec §4.1): one job per channel post, read by the
// channel notifier that pushes the post to offline followers.
message ChannelNotifyJob {
  ChatMessage message = 1;
}
