name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test every module (unit + integration)
        run: make verify

  contracts-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: platform-contracts
          lint: true
          breaking: false
          format: false
          push: false

  local-start:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make bootstrap
      - name: Kafka + Redis on localhost (spec §9.1 local)
        run: make infra-up
      - name: Start, connect, stop, restart (spec §9.1 R1, R3, R4)
        run: make local-check
      - name: Idle heap per session (10k sessions, < 5 KB)
        run: make memory-check
      - name: Idle load (18k sessions, loop lag p99 < 20 ms)
        # TODO: 50k (spec §12) needs a runner with ulimit -n >= 120000; GitHub-hosted runners allow 65536.
        run: make load-check N=18000
      - name: Tear down infra
        if: always()
        run: make infra-down

  dev-start:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make bootstrap
      - run: make images
      - name: Compose up (spec §9.1 R2)
        run: make up
      - run: make smoke
      - name: Gateway logs on failure
        if: failure()
        run: docker compose -f platform-devenv/docker-compose.yml --profile app logs --tail 200 gateway fake-pushapi kafka redis
      - name: Tear down
        if: always()
        run: make down
