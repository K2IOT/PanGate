# PanGate dev environment (spec §2.4, §9.1). One file, compose profiles:
#   (default)  infrastructure (Kafka, Redis, PostgreSQL); `make infra-up` exposes it on localhost (profile local)
#   app        auth + push-api + gateway + router, built with `make images`
#   tools      devtools container for `make smoke`
name: pangate

x-healthcheck: &hc
  interval: 5s
  timeout: 4s
  retries: 20
  start_period: 10s

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: pangate-dev-kafka-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for containers (kafka:29092), EXTERNAL for JVMs on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      <<: *hc
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        t=/opt/kafka/bin/kafka-topics.sh
        b=kafka:29092
        $$t --bootstrap-server $$b --create --if-not-exists --topic c1.gw.lifecycle --partitions 32
        for ty in telemetry cmd cmd_result read sdk.metrics; do
          $$t --bootstrap-server $$b --create --if-not-exists --topic c1.gw.upstream.$$ty --partitions 64
        done
        $$t --bootstrap-server $$b --create --if-not-exists --topic gw.control --partitions 8 --config cleanup.policy=compact
        # push path (docs/superpowers/specs/2026-11-10-push-contracts-design.md §2)
        $$t --bootstrap-server $$b --create --if-not-exists --topic c1.push.requests --partitions 64 --config retention.ms=86400000
        $$t --bootstrap-server $$b --create --if-not-exists --topic c1.push.offline --partitions 16 --config retention.ms=604800000
        $$t --bootstrap-server $$b --create --if-not-exists --topic c1.push.delivered --partitions 16 --config retention.ms=86400000
        # app chat (docs/superpowers/specs/2026-11-12-chat-core-design.md §8)
        $$t --bootstrap-server $$b --create --if-not-exists --topic chat.commands --partitions 64
        $$t --bootstrap-server $$b --create --if-not-exists --topic chat.events --partitions 64
        $$t --bootstrap-server $$b --create --if-not-exists --topic chat.commands.dlq --partitions 8
        echo topics ready

  redis:
    image: redis:7.4.2
    ports:
      - "6379:6379"
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: pangate
      POSTGRES_PASSWORD: pangate
      POSTGRES_DB: pangate
    ports:
      - "5432:5432"
    healthcheck:
      <<: *hc
      test: ["CMD", "pg_isready", "-U", "pangate", "-d", "pangate"]

  # ScyllaDB for the app chat (chat spec §5): one node, kept small for a laptop. Not in `make infra-up`
  # (the gateway's load checks do not need it); `make scylla-up` starts it.
  scylla:
    image: scylladb/scylla:6.2.3
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--developer-mode", "1"]
    ports:
      - "9042:9042"
    healthcheck:
      <<: *hc
      retries: 40
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null"]

  # Auth & Token service (docs/superpowers/specs/2026-11-05-auth-service-design.md): JWKS for the gateway, API and
  # connect tokens, revocations to gw.control. Seed secrets in /dev-secrets/auth/clients.json for devtools.
  auth:
    profiles: ["app"]
    image: pangate/auth-service:dev
    user: "0"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    volumes:
      - dev-secrets:/dev-secrets
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.auth.tools.HealthCheck",
             "http://127.0.0.1:8081/ready"]

  # Push API (docs/superpowers/specs/2026-11-10-push-api-design.md): POST /v1/push for tenant backends, gRPC
  # SendStream for the gateway's KICK; produces PushRecords to c1.push.requests for the router.
  push-api:
    profiles: ["app"]
    image: pangate/push-api-service:dev
    stop_grace_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "8085:8080"
      - "9443:9443"
      - "8084:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.pushapi.tools.HealthCheck",
             "http://127.0.0.1:8081/ready"]

  # Chat core (docs/superpowers/specs/2026-11-12-chat-core-design.md): commands from the gateways' upstream topic and
  # HTTP, ScyllaDB storage, fan-out through the Push API (plaintext gRPC in dev).
  chat:
    profiles: ["app"]
    image: pangate/chat-service:dev
    stop_grace_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "8086:8080"
      - "8087:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      auth:
        condition: service_healthy
      push-api:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.chat.tools.HealthCheck",
             "http://127.0.0.1:8081/ready"]

  # Push API stand-in, kept as a dev tool (profile tools): KICK → PushRecord CONTROL on Kafka.
  fake-pushapi:
    profiles: ["tools"]
    image: pangate/gateway-devtools:dev
    command: ["fake-pushapi", "--port", "9443", "--kafka", "kafka:29092"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.devtools.Main", "health",
             "--grpc", "localhost:9443"]

  gateway:
    profiles: ["app"]
    image: pangate/gateway-service:dev
    user: "0"
    # drain (profile dev: max 5 s) + loop shutdown must fit before SIGKILL (spec §7.5, §9.1 R3)
    stop_grace_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxDirectMemorySize=1g"
    volumes:
      - dev-secrets:/dev-secrets
    ports:
      - "8443:8443"
      - "8883:8883"
      - "9090:9090"
      - "8081:8081"
    depends_on:
      auth:
        condition: service_healthy
      push-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.gateway.tools.HealthCheck",
             "http://127.0.0.1:8081/ready"]

  # push-router (docs/superpowers/specs/2026-11-10-push-router-design.md): c1.push.requests → gateway gRPC.
  router:
    profiles: ["app"]
    image: pangate/push-router-service:dev
    stop_grace_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "8083:8081"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "java", "-cp", "@/app/jib-classpath-file", "com.pangate.router.tools.HealthCheck",
             "http://127.0.0.1:8081/ready"]

  devtools:
    profiles: ["tools"]
    image: pangate/gateway-devtools:dev
    user: "0"   # reads /dev-secrets/auth/clients.json (mode 600, written by auth as root)
    volumes:
      - dev-secrets:/dev-secrets:ro

volumes:
  dev-secrets:
