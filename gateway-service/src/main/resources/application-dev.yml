# Dev: everything runs in docker compose (platform-devenv).
pangate:
  az: dev
  secrets:
    dir: ${gateway.dev.dir}

gateway:
  outbound-budget: 1GB
  warmup: { iterations: 200 }
  drain: { interval: 1s, max-duration: 5s, listener-close-delay: 0s }
  shed: { cpu: false }
  grpc: { plaintext: true }
  push-api: { enabled: true, target: "dns:///fake-pushapi:9443", plaintext: true }
  node-id: gateway-dev-1
  dev:
    bootstrap-secrets: true
    dir: /dev-secrets
  tls:
    cert-file: ${gateway.dev.dir}/gateway.crt
    key-file: ${gateway.dev.dir}/gateway.key
  auth:
    jwks-uri: http://issuer:8090/.well-known/jwks.json
  limits:
    hard-cap: 200000
  startup: { dependency-timeout: 60s }
  redis:
    topology: standalone
    registry-uri: redis://redis:6379
    state-uri: redis://redis:6379
  kafka:
    bootstrap: kafka:29092
    create-topics: true
