# Production defaults (spec §9). Profiles local and dev override selected values.
spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 11m   # drain may take up to gateway.drain.max-duration (spec §7.5)
  threads:
    virtual:
      enabled: false

pangate:
  service: gateway

gateway:
  node-id: ${HOSTNAME:gateway-local}
  cell: cell-1
  listeners:
    ws: { port: 8443, path: /v1/ws, acceptors: 4 }
    tcp: { port: 8883, enabled: true }
  io: { threads: 0, transport: auto }
  tls:
    cert-file: /etc/pangate/tls/gateway.crt
    key-file: /etc/pangate/tls/gateway.key
  limits:
    hard-cap: 700000
    soft-cap: 550000
    per-ip: 200
    frame-max: 65536
    hello-max: 8192
    hello-timeout: 5s
    handshake-timeout: 10s
    handshakes-per-principal-per-min: 20
    heartbeat-interval: 30s
    session-ttl: 24h
    inbound-rate: 50
    inbound-burst: 100
    topics-per-conn: 100
    pending-ack: { msgs: 32, bytes: 64KB, timeout: 5s }
    slow-consumer-timeout: 30s
  admission: { rate: 5000, burst: 10000, ramp-from: 500, ramp-duration: 2m }
  auth:
    jwks-uri: https://auth/.well-known/jwks.json
    jwks-refresh: 5m
    audience: pangate-gw
    issuer: ""
    clock-skew: 30s
  broadcast: { rate-per-loop: 10000 }
  outbound-budget: 4GB
  recycling: { min: 30m, max: 90m, grace: 30s }
  drain: { batch-percent: 2, interval: 5s, max-delay: 60s, max-duration: 10m, listener-close-delay: 10s }
  warmup: { iterations: 2000, concurrency: 32, timeout: 60s }
  shed: { cpu: true }
  grpc:
    port: 9090
    plaintext: false
    allowed-spiffe: [spiffe://pangate/cell-1/push-router]
    tls:
      cert-file: /etc/pangate/grpc/gateway.crt
      key-file: /etc/pangate/grpc/gateway.key
      trust-file: /etc/pangate/grpc/spiffe-bundle.pem
  push-api: { enabled: true, target: "dns:///push-api:9443", plaintext: false }
  dev: { bootstrap-secrets: false, dir: /etc/pangate/dev }
  startup: { dependency-timeout: 120s }
  redis:
    topology: cluster                 # cluster | standalone
    registry-uri: redis://redis-registry:6379
    state-uri: redis://redis-state:6379
    command-timeout: 2s
  kafka:
    bootstrap: kafka:9092
    create-topics: false
    upstream-types: [telemetry, cmd, cmd_result, read, sdk.metrics]
    topic-prefix: c1
    reliable-buffer: 128MB
    telemetry-buffer: 128MB

# Management port only: Tomcat serves actuator, /ready, /live and /admin/drain.
server:
  port: 8081
  shutdown: immediate
  tomcat:
    threads: { max: 8, min-spare: 2 }
    max-connections: 200
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: gatewayReadiness
          additional-path: "server:/ready"
          show-details: always            # spec §7.9: reasons in details.reasons
        liveness:
          include: eventLoopLag
          additional-path: "server:/live"
